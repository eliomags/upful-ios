name: Jyanik CI

on:
  push:
    branches: [feature/jyanik-rebuild, main, prod]
  pull_request:
    branches: [prod, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Create Secrets.swift
        run: |
          cat > Upful/Supporting\ Files/Secrets.swift << 'EOF'
          struct Secrets {
              static let mixpanelToken = "TEST_TOKEN"
              static let intrinioApiKey = "TEST_KEY"
              static let iexProductionKey = "?token=TEST_TOKEN"
              static let iexSandboxKey = "?token=TEST_TOKEN"
              static let iexAppendingProductionKey = "&token=TEST_TOKEN"
              static let stockNewsApiToken = "TEST_TOKEN"
              static let iapSharedSecret = "TEST_SECRET"
          }
          EOF

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Upful.xcodeproj \
            -scheme Upful

      - name: Build
        run: |
          xcodebuild build \
            -project Upful.xcodeproj \
            -scheme Upful \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || true

      - name: Test
        run: |
          xcodebuild test \
            -project Upful.xcodeproj \
            -scheme Upful \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || true

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging --strict || true
