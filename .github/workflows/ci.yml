name: Jyanik CI

on:
  push:
    branches: [feature/jyanik-rebuild, main, prod]
  pull_request:
    branches: [prod, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build & Test job - DISABLED until Phase 3 creates new Jyanik scheme
  # Legacy Upful scheme requires Xcode SPM resolution + signing that CI can't do yet
  # Re-enable when Jyanik scheme exists with proper CI configuration
  #
  # build:
  #   name: Build & Test
  #   runs-on: macos-15
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
  #     - uses: actions/cache@v4
  #       with:
  #         path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
  #         key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
  #     - name: Build
  #       run: |
  #         xcodebuild build \
  #           -project Upful.xcodeproj \
  #           -scheme Jyanik \
  #           -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
  #           -configuration Debug \
  #           CODE_SIGNING_ALLOWED=NO \
  #           | xcbeautify || true

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging || true

  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check backend exists
        id: check-backend
        run: |
          if [ -d "backend" ] && [ -f "backend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: backend
        run: npm ci

      - name: Type check
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: backend
        run: npx tsc --noEmit

      - name: Lint
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint --if-present

      - name: Skip
        if: steps.check-backend.outputs.exists != 'true'
        run: echo "Backend not yet created, skipping"
