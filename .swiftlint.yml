# SwiftLint Configuration - Jyanik iOS App

included:
  - Jyanik
  # Note: Upful/ excluded until Phase 3 rewrite completes (too many legacy violations)

excluded:
  - Pods
  - DerivedData
  - .build
  - vendor

# Rules
opt_in_rules:
  - closure_spacing
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - implicitly_unwrapped_optional
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - overridden_super_call
  - private_action
  - private_outlet
  - prohibited_super_call
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  - trailing_whitespace
  - todo

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 100

function_parameter_count:
  warning: 6
  error: 8

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - x
    - y
    - i
    - j
    - k

force_cast: error
force_try: warning
force_unwrapping: error

nesting:
  type_level: 3
  function_level: 5

cyclomatic_complexity:
  warning: 15
  error: 25

# Custom rules
custom_rules:
  no_print:
    name: "No print() in production"
    regex: "\\bprint\\("
    message: "Use Logger instead of print()"
    severity: warning
    match_kinds:
      - identifier
